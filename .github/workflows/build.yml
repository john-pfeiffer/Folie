name: Build

on:
  push:
    branches:
      - develop
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            extra_cmake: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            pluginval_url: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          - name: Windows
            os: windows-2022
            extra_cmake: ''
            pluginval_url: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        shell: bash
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          # Key must match the tag in cmake/GetJUCE.cmake
          key: ${{ matrix.os }}-juce-9.0.1

      - name: Configure
        shell: bash
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.extra_cmake }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run DSP tests
        run: ctest --test-dir build --output-on-failure

      - name: Fetch pluginval
        shell: bash
        run: |
          curl -fL "${{ matrix.pluginval_url }}" -o pluginval.zip
          unzip -o pluginval.zip

      - name: pluginval (VST3)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            PV=./pluginval.app/Contents/MacOS/pluginval
          else
            PV=./pluginval.exe
          fi
          "$PV" --strictness-level 5 --verbose --timeout-ms 120000 \
                --validate "build/Folie_artefacts/Release/VST3/Folie.vst3"

      - name: Stage artifact
        shell: bash
        run: |
          mkdir stage
          cp -R "build/Folie_artefacts/Release/VST3/Folie.vst3" stage/
          if [ "$RUNNER_OS" == "macOS" ]; then
            cp -R "build/Folie_artefacts/Release/AU/Folie.component" stage/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folie-${{ matrix.name }}-${{ steps.sha.outputs.short }}
          path: stage/
          if-no-files-found: error
